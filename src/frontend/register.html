<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Study Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="site-logo">Study Timer</a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Start earning points and building your room.</p>

      <p id="formMessage" class="form-message" role="alert"></p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="At least 3 characters" required minlength="3">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
